name: Bug Report
description: File a bug report.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the sections below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the exact steps to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-results
    attributes:
      label: Expected Results
      description: What did you expect to happen?
      placeholder: Describe what should have happened.
    validations:
      required: false

  - type: textarea
    id: actual-results
    attributes:
      label: Actual Results
      description: What actually happened instead?
      placeholder: Describe what actually happened, including any error messages.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recordings
      description: If applicable, drag and drop screenshots or screen recordings here to help explain the problem. GitHub will automatically attach and embed them.
      placeholder: Drag and drop image or video files here...
    validations:
      required: false
