name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you submit
      options:
        - label: I've searched existing issues and this hasn't been requested already.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What functionality are you trying to unlock?
      placeholder: "As a ..., I want to ... so that ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work? Rough ideas are fine.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, related issues, or anything else that helps.
    validations:
      required: false